<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Breathing Skeleton Loader Demo</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: #0a0e27; /* dark navy */
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .skeleton-page {
    display: flex;
    flex-direction: column;
    gap: 24px;
    width: min(90vw, 420px);
  }

  /* Base pulse styling shared by every skeleton shape */
  .skel {
    background: #ffffff;
    opacity: 0.3;
    animation: pulse 5s ease-in-out infinite;
  }

  .skel.line { height: 14px; border-radius: 4px; }
  .skel.avatar { width: 56px; height: 56px; border-radius: 50%; flex-shrink: 0; }
  .skel.heading { height: 26px; border-radius: 5px; width: 65%; }
  .skel.image { height: 110px; width: 100%; border-radius: 8px; }

  /* --- Header: avatar + name/subtitle --- */
  .header-row {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .header-text {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
  }

  .header-text .line:nth-child(1) { width: 130px; }
  .header-text .line:nth-child(2) { width: 90px; height: 11px; }

  /* --- Paragraph lines --- */
  .paragraph {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 12px;
  }

  .paragraph .line:nth-child(1) { width: 100%; }
  .paragraph .line:nth-child(2) { width: 88%; }
  .paragraph .line:nth-child(3) { width: 95%; }
  .paragraph .line:nth-child(4) { width: 70%; }
  .paragraph .line:nth-child(5) { width: 60%; }
  .paragraph .line:nth-child(6) { width: 45%; }

  /* --- Cards row --- */
  .cards {
    display: flex;
    gap: 16px;
    margin-top: 40px; /* parent's 24px gap + this = 64px total above the cards row */
  }

  .card {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
  }

  .card .line:nth-child(2) { width: 90%; }
  .card .line:nth-child(3) { width: 55%; }

  @keyframes pulse {
    0% {
      opacity: 0.3;
      animation-timing-function: cubic-bezier(0.597, 0.011, 0.686, 0.961); /* inhale */
    }
    32% {
      opacity: 1;
      animation-timing-function: cubic-bezier(0.314, 0.039, 0.403, 0.989); /* exhale */
    }
    88% {
      opacity: 0.3;
      animation-timing-function: linear; /* pause, held flat */
    }
    100% {
      opacity: 0.3;
    }
  }
</style>
</head>
<body>
  <div class="skeleton-page">

    <!-- Header: avatar + name/subtitle -->
    <div class="header-row">
      <div class="skel avatar" style="animation-delay: 0s;"></div>
      <div class="header-text">
        <div class="skel line" style="animation-delay: 0.08s;"></div>
        <div class="skel line" style="animation-delay: 0.16s;"></div>
      </div>
    </div>

    <!-- Large page heading -->
    <div class="skel heading" style="animation-delay: 0.3s;"></div>

    <!-- Paragraph text lines -->
    <div class="paragraph">
      <div class="skel line" style="animation-delay: 0.45s;"></div>
      <div class="skel line" style="animation-delay: 0.55s;"></div>
      <div class="skel line" style="animation-delay: 0.65s;"></div>
      <div class="skel line" style="animation-delay: 0.75s;"></div>
      <div class="skel line" style="animation-delay: 0.85s;"></div>
      <div class="skel line" style="animation-delay: 0.95s;"></div>
    </div>

    <!-- Cards row: image + text per card.
         The downward wave arrives at this row, then switches direction:
         the leftmost card leads and the sweep moves left -> right. -->
    <div class="cards">
      <div class="card"> <!-- leftmost: first to light up -->
        <div class="skel image" style="animation-delay: 1.1s;"></div>
        <div class="skel line" style="animation-delay: 1.25s;"></div>
        <div class="skel line" style="animation-delay: 1.35s;"></div>
      </div>
      <div class="card"> <!-- middle -->
        <div class="skel image" style="animation-delay: 1.25s;"></div>
        <div class="skel line" style="animation-delay: 1.4s;"></div>
        <div class="skel line" style="animation-delay: 1.5s;"></div>
      </div>
      <div class="card"> <!-- rightmost: last to light up -->
        <div class="skel image" style="animation-delay: 1.4s;"></div>
        <div class="skel line" style="animation-delay: 1.55s;"></div>
        <div class="skel line" style="animation-delay: 1.65s;"></div>
      </div>
    </div>

  </div>
</body>
</html>
